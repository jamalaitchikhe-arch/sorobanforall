<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سوروبان للجميع | Soroban for All</title>
<meta name="description" content="منصة سوروبان للجميع للحساب الذهني — Smart Education Maroc">
<link rel="icon" href="logo-soroban.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a1a36; --navy2:#10264d; --navy3:#173463; --line:#24467e;
  --orange:#f7931e; --orange2:#ff7a00; --gold:#f5c542; --sky:#4fa3ff;
  --text:#eef3ff; --muted:#9fb3d6; --ok:#2ecc8f; --bad:#ff5d6c;
  --r:18px; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(1200px 600px at 85% -10%,#1b3e7a 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#2a1f05 0%,transparent 55%),var(--navy);color:var(--text);min-height:100vh;line-height:1.7}
a{color:var(--gold)}
button,input,select,textarea{font-family:inherit;font-size:1rem}
.wrap{max-width:1150px;margin:0 auto;padding:0 18px}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(10,26,54,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.brand img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--orange)}
.brand b{font-size:1.15rem;font-weight:900;display:block;line-height:1.1}
.brand small{color:var(--orange);font-weight:700;font-size:.8rem;letter-spacing:.5px}
nav{margin-inline-start:auto;display:flex;gap:6px}
nav a{color:var(--muted);text-decoration:none;padding:8px 14px;border-radius:12px;font-weight:700;transition:.2s}
nav a:hover{color:var(--text);background:var(--navy3)}
nav a.on{color:#1a1200;background:var(--orange)}
.burger{display:none;margin-inline-start:auto;background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 12px;cursor:pointer}
@media(max-width:760px){
  .burger{display:block}
  nav{display:none;position:absolute;top:68px;inset-inline:0;flex-direction:column;background:var(--navy2);padding:10px;border-bottom:1px solid var(--line)}
  nav.open{display:flex}
}

main{padding:28px 0 60px;min-height:70vh}
h1,h2,h3{line-height:1.35;margin:0 0 .5em}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 20px;font-weight:800;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s;color:#1a1200;background:linear-gradient(135deg,var(--gold),var(--orange))}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--orange)}
.btn.blue{background:linear-gradient(135deg,#5bb0ff,#2f6fe0);color:#fff}
.btn.red{background:#3a1d2a;color:#ffb3bb;border:1px solid #6b2b3b}
.btn.sm{padding:6px 12px;font-size:.9rem;border-radius:10px}
.card{background:linear-gradient(180deg,var(--navy2),#0d2145);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tag{display:inline-block;font-size:.78rem;font-weight:800;padding:2px 10px;border-radius:99px;background:rgba(247,147,30,.15);color:var(--orange);border:1px solid rgba(247,147,30,.35)}
.tag.gold{background:rgba(245,197,66,.12);color:var(--gold);border-color:rgba(245,197,66,.35)}
.tag.blue{background:rgba(79,163,255,.12);color:var(--sky);border-color:rgba(79,163,255,.35)}
.tag.red{background:rgba(255,93,108,.12);color:var(--bad);border-color:rgba(255,93,108,.35)}
.tag.green{background:rgba(46,204,143,.12);color:var(--ok);border-color:rgba(46,204,143,.35)}
.sec-title{display:flex;align-items:center;gap:12px;margin:34px 0 16px}
.sec-title h2{margin:0;font-size:1.45rem}
.sec-title::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--line))}
.empty{text-align:center;padding:36px 16px;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r)}
.empty .ico{font-size:2.4rem}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:26px;align-items:center;padding:20px 0 10px}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:900}
.hero h1 span{color:var(--orange)}
.hero .en{font-weight:800;color:var(--gold);letter-spacing:1px}
.hero p.lead{font-size:1.12rem;color:#cfdcf5;max-width:560px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hero-art{display:flex;justify-content:center;align-items:center;position:relative}
.hero-art .ring{width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#1d3f78,#0d2145);border:3px solid var(--gold);display:grid;place-items:center;box-shadow:0 0 60px rgba(247,147,30,.25)}
.hero-art .ring img{width:200px;height:200px;border-radius:50%;object-fit:cover}
@media(max-width:760px){.hero{grid-template-columns:1fr;text-align:center}.hero .cta{justify-content:center}.hero p.lead{margin-inline:auto}.hero-art .ring{width:200px;height:200px}.hero-art .ring img{width:150px;height:150px}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.stat{background:var(--navy2);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-size:1.6rem;color:var(--gold);font-weight:900}
.stat span{color:var(--muted);font-size:.9rem}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}

/* announcements */
.ann{position:relative;padding-inline-start:22px}
.ann::before{content:"";position:absolute;inset-block:18px;inset-inline-start:0;width:5px;border-radius:5px;background:var(--orange)}
.ann.pin::before{background:var(--gold)}
.ann h3{margin:6px 0 6px;font-size:1.15rem}
.ann .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.ann .body{white-space:pre-line;color:#d7e2f7}

/* groups */
.gcard{position:relative;overflow:hidden;cursor:pointer;text-decoration:none;color:var(--text);display:block;transition:transform .2s,border-color .2s}
.gcard:hover{transform:translateY(-4px);border-color:var(--orange)}
.gcard .num{position:absolute;inset-inline-end:-10px;top:-24px;font-size:6.5rem;font-weight:900;color:rgba(255,255,255,.05)}
.gcard .lock{font-size:1.5rem}
.gcard h3{font-size:1.25rem;margin:8px 0 4px}
.gcard .lvl{display:flex;gap:4px;margin-top:10px}
.gcard .lvl i{height:6px;flex:1;border-radius:4px;background:#22406f}
.gcard .lvl i.f{background:linear-gradient(90deg,var(--gold),var(--orange))}

/* lock */
.lockbox{max-width:440px;margin:30px auto;text-align:center}
.lockbox .big{font-size:3rem}
.field{display:block;text-align:start;margin:10px 0}
.field span{display:block;font-weight:700;margin-bottom:4px;font-size:.92rem;color:#cbd8f1}
.input,select.input,textarea.input{width:100%;background:#081530;border:1.5px solid var(--line);color:var(--text);border-radius:12px;padding:10px 14px;outline:none}
.input:focus{border-color:var(--orange)}
.code-in{text-align:center;font-size:1.5rem;letter-spacing:6px;font-weight:900;text-transform:uppercase}
.err{color:var(--bad);font-weight:700;min-height:1.6em}

/* group page */
.ghead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.gbadge{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;font-size:2rem;font-weight:900;color:#1a1200;background:linear-gradient(135deg,var(--gold),var(--orange));box-shadow:0 8px 24px rgba(247,147,30,.35)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 18px;border-bottom:1px solid var(--line);padding-bottom:12px}
.tabs a{text-decoration:none;color:var(--muted);font-weight:800;padding:9px 16px;border-radius:12px;background:var(--navy2);border:1px solid var(--line)}
.tabs a.on{color:#1a1200;background:var(--orange);border-color:var(--orange)}
.rec{display:flex;gap:14px;align-items:center}
.rec .play{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:rgba(79,163,255,.15);border:1px solid rgba(79,163,255,.4);font-size:1.5rem;cursor:pointer}
.rec .info{flex:1;min-width:0}
.rec h3{font-size:1.05rem;margin:0}
.rec .actions{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:600px){.rec{flex-wrap:wrap}.rec .actions{width:100%}}
.hw h3{font-size:1.1rem;margin:6px 0}
.hw .desc{white-space:pre-line;color:#d7e2f7}

/* modal */
.modal{position:fixed;inset:0;background:rgba(3,8,20,.85);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal .box{width:min(960px,100%);background:var(--navy2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.modal .mh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.modal .mh b{flex:1}
.modal .vid{position:relative;padding-top:56.25%;background:#000}
.modal iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* games */
.game-card{cursor:pointer;transition:.2s;text-align:center}
.game-card:hover{transform:translateY(-4px);border-color:var(--gold)}
.game-card .ico{font-size:2.8rem}
.game-card h3{margin:6px 0 4px}
.stage{text-align:center}
.flash{height:220px;display:grid;place-items:center;font-size:clamp(4rem,14vw,8rem);font-weight:900;color:var(--gold);background:#071026;border-radius:var(--r);border:1px solid var(--line);margin:14px 0;font-variant-numeric:tabular-nums;direction:ltr}
.flash.neg{color:#ff8a7a}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:end}
.row .field{min-width:130px;margin:4px 0}
.ans{max-width:260px;margin:10px auto;text-align:center;font-size:1.6rem;font-weight:900;direction:ltr}
.result{font-size:1.25rem;font-weight:900;margin:10px 0}
.result.ok{color:var(--ok)} .result.bad{color:var(--bad)}
.timer{font-size:2.2rem;font-weight:900;color:var(--orange)}
.problem{font-size:clamp(2.2rem,8vw,3.6rem);font-weight:900;direction:ltr;margin:10px 0;font-variant-numeric:tabular-nums}
.score-pill{display:inline-block;background:var(--navy3);border-radius:99px;padding:4px 14px;font-weight:800;margin:0 4px}
.abacus-wrap{direction:ltr;display:flex;justify-content:center;margin:12px 0;overflow-x:auto}
.abacus-wrap svg{max-width:100%;height:auto}
.bead{cursor:pointer;transition:transform .15s}

/* exercises */
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ex{background:#0b1b3a;border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.ex .n{font-size:.8rem;color:var(--muted)}
.ex .col{direction:ltr;font-weight:900;font-size:1.25rem;line-height:1.5;text-align:right;padding:4px 18px;font-variant-numeric:tabular-nums}
.ex .col div{border-bottom:1px dashed transparent}
.ex .col div:last-child{border-bottom:2px solid var(--muted)}
.ex input{width:100%;margin-top:8px;text-align:center;font-weight:900;direction:ltr}
.ex.ok{border-color:var(--ok);background:rgba(46,204,143,.08)}
.ex.bad{border-color:var(--bad);background:rgba(255,93,108,.08)}
.ex .fix{color:var(--ok);font-weight:800;font-size:.9rem;min-height:1.4em}

/* admin */
.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.list-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#0b1b3a;margin-bottom:8px}
.list-item .t{flex:1;min-width:0;word-break:break-word}
.list-item small{color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 14px}
.notice{background:rgba(245,197,66,.08);border:1px solid rgba(245,197,66,.35);border-radius:14px;padding:12px 16px;color:#f3e2a6}
.dirty-bar{position:sticky;bottom:12px;z-index:40;margin-top:20px;display:none;align-items:center;gap:10px;flex-wrap:wrap;background:#2a1b05;border:1px solid var(--orange);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow)}
.dirty-bar.show{display:flex}
.dirty-bar b{flex:1}

footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:.92rem}
footer .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
footer img{width:44px;height:44px;border-radius:50%;background:#fff}
footer .sp{flex:1}
.wa{position:fixed;bottom:18px;inset-inline-start:18px;z-index:60;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#25d366;color:#fff;font-size:1.7rem;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--navy3);border:1px solid var(--orange);padding:10px 20px;border-radius:14px;font-weight:800;z-index:200;transition:.3s;opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media print{header,footer,.tabs,.wa,.no-print,.ghead .btn{display:none!important}body{background:#fff;color:#000}.ex{border-color:#999;background:#fff}.ex .col{color:#000}main{padding:0}}
.lang-btn{margin-inline-start:12px;min-width:48px;height:40px;border-radius:12px;border:1.5px solid var(--gold);background:rgba(245,197,66,.1);color:var(--gold);font-weight:900;cursor:pointer;font-size:1rem}
.lang-btn:hover{background:var(--gold);color:#1a1200}
@media(max-width:760px){.lang-btn{margin-inline-start:auto}.burger{margin-inline-start:8px!important}}
.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:900px){.g5{grid-template-columns:repeat(4,1fr)}}
@media(max-width:600px){.g5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:400px){.g5{grid-template-columns:repeat(2,1fr)}}
.gcard{text-align:center;padding:22px 10px}
.gcard .lock{position:absolute;top:10px;inset-inline-end:12px;font-size:1.1rem}
.gnum{font-size:3.2rem;font-weight:900;line-height:1;background:linear-gradient(135deg,var(--gold),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.glabel{margin-top:6px;font-weight:700;color:var(--muted)}
.lvl-sel{min-width:130px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.sub{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.chip{border:1.5px solid var(--line);background:#0b1b3a;color:var(--text);border-radius:14px;padding:8px 14px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:flex-start;line-height:1.35;transition:.15s}
.chip span{font-size:.85rem;color:var(--muted)}
.chip:hover{border-color:var(--orange)}
.chip.on{background:linear-gradient(135deg,var(--gold),var(--orange));border-color:var(--orange);color:#1a1200}
.chip.on span{color:#3a2600}
.chip.sm{padding:6px 12px;font-weight:700;font-size:.9rem;flex-direction:row}
.chip.ch{border-color:rgba(79,163,255,.5)}
.ex .col .neg{color:#ff8a9a}
.print-title{font-size:1.15rem}
@media print{.print-title{color:#000}.ex .col .neg{color:#c00}}
.login .name-in{text-align:center;font-size:1.25rem;font-weight:800}
.gender{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.gbtn{border:2px solid var(--line);background:#0b1b3a;color:var(--text);border-radius:16px;padding:10px;font-weight:800;cursor:pointer;font-family:inherit;font-size:1rem;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.gbtn span{font-size:1.6rem}
.gbtn:hover{border-color:var(--orange)}
.gbtn.on{border-color:var(--gold);background:rgba(245,197,66,.15);box-shadow:0 0 0 3px rgba(245,197,66,.2);transform:scale(1.03)}
.big-btn{font-size:1.1rem;padding:13px 22px}
.hi{color:var(--gold);font-weight:700;font-size:1rem}
.welcome{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(30,70,140,.97),rgba(5,12,30,.98) 70%);opacity:0;transition:opacity .4s;padding:20px}
.welcome.show{opacity:1}.welcome.hide{opacity:0}
.welcome canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wbox{position:relative;text-align:center;max-width:640px;transform:scale(.6);transition:transform .6s cubic-bezier(.2,1.6,.4,1)}
.welcome.show .wbox{transform:scale(1)}
.wring{position:relative;width:170px;height:170px;margin:0 auto 10px;display:grid;place-items:center}
.wring::before{content:"";position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle,rgba(245,197,66,.45),transparent 70%);animation:pulse 1.4s ease-in-out infinite}
.trophy{font-size:4.6rem;animation:bounce 1.2s ease-in-out infinite;filter:drop-shadow(0 6px 18px rgba(247,147,30,.6))}
.orbit{position:absolute;inset:0;animation:spin 6s linear infinite}
.orbit i{position:absolute;left:50%;top:50%;width:26px;height:15px;margin:-7.5px -13px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe08a,#f7931e);box-shadow:0 0 12px rgba(247,147,30,.8);transform:rotate(calc(var(--i)*45deg)) translateY(-78px)}
.orbit i:nth-child(even){background:radial-gradient(circle at 40% 35%,#9cc8ff,#2f6fe0);box-shadow:0 0 12px rgba(79,163,255,.8)}
.wtitle{font-size:clamp(1.9rem,6vw,3.2rem);font-weight:900;margin:6px 0;animation:rise .7s .15s both}
.wname{display:inline-block;background:linear-gradient(90deg,var(--gold),#fff6c9,var(--orange),var(--gold));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.2s linear infinite,pop .8s .3s both;padding:0 .05em}
.wsub{font-size:clamp(1.05rem,3.2vw,1.35rem);color:#d9e6ff;margin:6px auto 14px;max-width:520px;animation:rise .7s .45s both}
.wvisit{display:inline-block;background:rgba(247,147,30,.15);border:1px solid var(--orange);color:var(--gold);border-radius:99px;padding:5px 16px;font-weight:800;margin-bottom:16px;animation:rise .7s .6s both}
.wgo{display:flex;margin:0 auto;animation:rise .7s .75s both,glow 1.8s 1.5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.06)}}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.15);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shine{to{background-position:-300% 0}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(247,147,30,.6)}50%{box-shadow:0 0 0 14px rgba(247,147,30,0)}}
@media (prefers-reduced-motion:reduce){.orbit,.trophy,.wname,.wgo,.wring::before{animation:none}}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="#home"><img src="logo-soroban.png" alt="Soroban for All"><div><b data-i="brand"></b><small>SOROBAN FOR ALL</small></div></a>
    <nav id="nav">
      <a href="#home" data-nav="home" data-i="navHome"></a>
      <a href="#announcements" data-nav="announcements" data-i="navAnn"></a>
      <a href="#groups" data-nav="groups" data-i="navGroups"></a>
    </nav>
    <button class="lang-btn" id="langBtn" title="Langue / اللغة"></button>
    <button class="burger" id="burger" aria-label="menu">☰</button>
  </div>
</header>

<main><div class="wrap" id="app"></div></main>

<footer>
  <div class="wrap">
    <img src="logo-sem.png" alt="Smart Education Maroc">
    <div><b style="color:var(--text)">Smart Education Maroc — S.E.M</b><br><span data-i="slogan"></span></div>
    <div class="sp"></div>
    <a href="#admin" style="color:var(--muted);text-decoration:none">🔐 <span data-i="teacherSpace"></span></a>
  </div>

}
async function encryptJSON(obj, pass){
  const s = crypto.getRandomValues(new Uint8Array(16)), i = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, s);
  const c = await crypto.subtle.encrypt({name:"AES-GCM", iv:i}, key, TE.encode(JSON.stringify(obj)));
  return {s:b64(s), i:b64(i), c:b64(c)};
}
async function decryptJSON(blob, pass){
  const key = await deriveKey(pass, unb64(blob.s));
  const p = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(blob.i)}, key, unb64(blob.c));
  return JSON.parse(TD.decode(p));
}

function playChime(){
  try{ const A = new (window.AudioContext||window.webkitAudioContext)(); const now = A.currentTime;
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>{ const o=A.createOscillator(), g=A.createGain(); o.type="triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,now+i*0.11); g.gain.exponentialRampToValueAtTime(0.18,now+i*0.11+0.02); g.gain.exponentialRampToValueAtTime(0.0001,now+i*0.11+0.5);
      o.connect(g).connect(A.destination); o.start(now+i*0.11); o.stop(now+i*0.11+0.55); });
    setTimeout(()=>{ try{A.close();}catch(e){} }, 1500);
  }catch(e){}
}
function confettiBurst(canvas){
  const ctx = canvas.getContext("2d"), dpr = Math.min(window.devicePixelRatio||1, 2);
  const W = canvas.width = innerWidth*dpr, H = canvas.height = innerHeight*dpr;
  const colors = ["#f5c542","#f7931e","#ff7a00","#4fa3ff","#2ecc8f","#ffffff","#ff5d6c"];
  const P = [];
  const burst = (x,y,n) => { for(let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, v = (4+Math.random()*9)*dpr;
    P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6*dpr,r:(3+Math.random()*5)*dpr,c:colors[i%colors.length],rot:Math.random()*6,vr:(Math.random()-.5)*.3,shape:Math.random()<.35?"bead":"rect",life:0}); } };
  burst(W/2, H*0.42, 140); setTimeout(()=>{ burst(W*0.15,H*0.75,60); burst(W*0.85,H*0.75,60); }, 350);
  let raf; const t0 = performance.now();
  const step = now => {
    ctx.clearRect(0,0,W,H);
    P.forEach(p=>{ p.vy += 0.22*dpr; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - p.life/220);
      if(p.shape==="bead"){ ctx.beginPath(); ctx.ellipse(0,0,p.r*1.6,p.r,0,0,Math.PI*2); ctx.fill(); } else ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);
      ctx.restore(); });
    if(now - t0 < 4200) raf = requestAnimationFrame(step); else ctx.clearRect(0,0,W,H);
  };
  raf = requestAnimationFrame(step);
  return () => cancelAnimationFrame(raf);
}

function makeProblem(L){
  const ops = ["+"]; if(L.neg) ops.push("-"); if(L.mul) ops.push("×"); if(L.div) ops.push("÷");
  const op = ops[rnd(0,ops.length-1)];
  if(op==="×"){ const a = L.d>=3? rnd(10,99): rnd(2,9), b = rnd(2,9); return {q:`${a} × ${b}`, a:a*b}; }
  if(op==="÷"){ const b = rnd(2,9), q = rnd(2, L.d>=3?30:12); return {q:`${b*q} ÷ ${b}`, a:q}; }
  const a = randD(L.d), b = randD(L.d);
  if(op==="-"){ const [x,y] = a>=b?[a,b]:[b,a]; return {q:`${x} − ${y}`, a:x-y}; }
  return {q:`${a} + ${b}`, a:a+b};
}

/* --- رسم السوروبان --- */
function abacusSVG(value, rods, interactive){
  const W = 70, H = 260, beam = 90, pad = 20, w = rods*W + pad*2;
  const digits = String(value).padStart(rods,"0").slice(-rods).split("").map(Number);
  let rodsS = "", beads = "", dots = "";
  digits.forEach((dv, r) => {
    const cx = pad + W*r + W/2;
    rodsS += `<line x1="${cx}" y1="${pad}" x2="${cx}" y2="${H+pad}" stroke="#c9a46a" stroke-width="4"/>`;
    const heavenOn = dv>=5, earth = dv%5;
    const bead = (y, on, attrs) => `<g class="bead" ${attrs}><ellipse cx="${cx}" cy="${y}" rx="28" ry="13" fill="${on?"url(#gOn)":"url(#gOff)"}" stroke="${on?"#b85f00":"#3c5a8a"}" stroke-width="2"/></g>`;
    beads += bead(heavenOn ? beam+pad-18 : pad+18, heavenOn, interactive?`data-r="${r}" data-b="h"`:"");
    for(let k=0;k<4;k++){
      const on = k < earth;
      const y = on ? beam+pad+18 + k*27 : (H+pad-18) - (3-k)*27;
      beads += bead(y, on, interactive?`data-r="${r}" data-b="${k}"`:"");
    }
    if((rods-1-r)%3===0) dots += `<circle cx="${cx}" cy="${beam+pad}" r="3.5" fill="#fff"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${H+pad*2}" width="${Math.min(w*1.2, 560)}" xmlns="http://www.w3.org/2000/svg">
   <defs><radialGradient id="gOn" cx="40%" cy="35%"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f7931e"/></radialGradient><radialGradient id="gOff" cx="40%" cy="35%"><stop offset="0" stop-color="#5b7fbf"/><stop offset="1" stop-color="#23406e"/></radialGradient></defs>
   <rect x="2" y="2" width="${w-4}" height="${H+pad*2-4}" rx="16" fill="#5a3412" stroke="#3a2008" stroke-width="4"/>
   <rect x="12" y="12" width="${w-24}" height="${H+pad*2-24}" rx="8" fill="#0b1b3a"/>
   ${rodsS}<rect x="12" y="${beam+pad-5}" width="${w-24}" height="10" fill="#c9a46a"/>${dots}${beads}</svg>`;
}
function gameRead(body, g, L, c){
  const rods = Math.max(L.rods,1), show = Math.max(rods,3); let round = 0, score = 0, val;
  body.innerHTML = `<div class="card stage">${backBtn()}<h2 style="margin-top:10px">🧮 ${t("gRead")}</h2>
    <div><span class="score-pill">${t("round")} <b id="bR">1</b>/10</span><span class="score-pill">✔ <b id="bS">0</b></span></div>
    <div class="abacus-wrap" id="bAb"></div><form id="bF"><input class="input ans" id="bA" inputmode="numeric" autocomplete="off" placeholder="${t("theNumber")}"><br><button class="btn">${t("check")}</button></form><div class="result" id="bRes"></div></div>`;
  bindBack(body,g,c);
  const next = () => { val = rnd(rods===1?1:10**(rods-1), 10**rods-1); $("#bAb").innerHTML = abacusSVG(val, show, false); $("#bA").value=""; $("#bA").focus(); $("#bR").textContent = round+1; };
  $("#bF").onsubmit = e => { e.preventDefault(); if(round>=10) return;
    const ok = Number($("#bA").value)===val; if(ok) score++; $("#bS").textContent = score;
    $("#bRes").className = "result "+(ok?"ok":"bad"); $("#bRes").textContent = ok ? t("yes") : t("numIs")+val; round++;
    if(round>=10){ $("#bF").innerHTML = `<div class="result ok">${t("final")}${score}/10</div><button type="button" class="btn" id="bAgain">${t("again")}</button>`; $("#bAgain").onclick = () => gameRead(body,g,L,c); }
    else gameTimers.push(setTimeout(next, 900)); };
  next();
}
function gameBuild(body, g, L, c){
  const rods = Math.max(L.rods,1), show = Math.max(rods,3); let target, cur, score = 0, round = 0;
  body.innerHTML = `<div class="card stage">${backBtn()}<h2 style="margin-top:10px">🎯 ${t("gBuild")}</h2>
    <p class="muted">${t("tapBeads")}</p>
    <div><span class="score-pill">${t("round")} <b id="cR">1</b>/10</span><span class="score-pill">✔ <b id="cS">0</b></span></div>
    <div class="problem" style="color:var(--gold)" id="cT"></div>
    <div class="abacus-wrap" id="cAb"></div><div class="muted">${t("curVal")}<b id="cV">0</b></div>
    <br><button class="btn" id="cChk">${t("check")}</button> <button class="btn ghost" id="cClr">${t("reset")}</button><div class="result" id="cRes"></div></div>`;
  bindBack(body,g,c);
  const draw = () => { $("#cAb").innerHTML = abacusSVG(cur.join(""), show, true); $("#cV").textContent = Number(cur.join(""));
    $("#cAb").querySelectorAll(".bead").forEach(b => b.onclick = () => { const r = +b.dataset.r, ty = b.dataset.b; let v = cur[r];
      if(ty==="h") v = v>=5 ? v-5 : v+5; else { const k = +ty, e = v%5, h = v-e; v = h + (k < e ? k : k+1); } cur[r] = v; draw(); }); };
  const next = () => { target = rnd(rods===1?1:10**(rods-1), 10**rods-1); cur = Array(show).fill(0); $("#cT").textContent = target; $("#cR").textContent = round+1; $("#cRes").textContent=""; draw(); };
  $("#cClr").onclick = () => { cur = Array(show).fill(0); draw(); };
  $("#cChk").onclick = () => { if(round>=10) return; const ok = Number(cur.join(""))===target; if(ok) score++; $("#cS").textContent = score;
    $("#cRes").className = "result "+(ok?"ok":"bad"); $("#cRes").textContent = ok ? t("great") : t("notYet"); round++;
    if(!ok){ cur = String(target).padStart(show,"0").split("").map(Number); draw(); }
    if(round>=10){ $("#cRes").textContent += ` — ${t("final")}${score}/10`; $("#cChk").textContent = t("again"); $("#cChk").onclick = () => gameBuild(body,g,L,c); }
    else gameTimers.push(setTimeout(next, ok?900:2200)); };
  next();
}

   <div class="card"><h3>${t("curAnn")} (${list.length})</h3>${list.length?list.map((a,k)=>`<div class="list-item"><div class="t"><b>${a.pinned?"📌 ":""}${esc(a.title)}</b>${a.title_fr?`<br><span dir="ltr">🇫🇷 ${esc(a.title_fr)}</span>`:""}<br><small>${esc(a.date||"")} ${a.tag?"· "+esc(a.tag):""}</small></div>
     <button class="btn sm ghost" data-pin="${k}">${a.pinned?t("unpin"):t("pin")}</button><button class="btn sm red" data-del="${k}">${t("del")}</button></div>`).join(""):`<p class="muted">${t("noAnn")}</p>`}</div></div>`;
  $("#annF").onsubmit = e => { e.preventDefault(); const o = fd(e.target); if(o.url && !safeUrl(o.url)) return toast(t("needHttps"));
    list.push({id:Date.now(), title:o.title, body:o.body, title_fr:o.title_fr, body_fr:o.body_fr, tag:o.tag, date:o.date||today(), url:o.url, pinned: !!o.pinned}); markDirty(); toast(t("annAdded")); admAnn(b); };
  b.querySelectorAll("[data-del]").forEach(x => x.onclick = () => armed(x, () => { list.splice(+x.dataset.del,1); markDirty(); admAnn(b); }));
  b.querySelectorAll("[data-pin]").forEach(x => x.onclick = () => { const a = list[+x.dataset.pin]; a.pinned = !a.pinned; markDirty(); admAnn(b); });
}

function admGrp(b){
  const G = A.groups.find(g=>g.id===aGroup) || A.groups[0]; aGroup = G.id; const C = G.content;
  C.recordings = C.recordings||[]; C.homework = C.homework||[]; C.games = C.games||[]; C.challenge = C.challenge||{};
  const item = (key, k, main, sub) => `<div class="list-item"><div class="t"><b>${esc(main)}</b><br><small>${sub}</small></div><button class="btn sm red" data-rm="${key}:${k}">${t("del")}</button></div>`;
  b.innerHTML = `
  <div class="card" style="margin-bottom:16px"><form id="gInfo" class="row" style="justify-content:flex-start">
    <label class="field"><span>${t("chooseGroup")}</span><select class="input" id="gSel">${A.groups.map(g=>`<option value="${g.id}" ${g.id===G.id?"selected":""}>${esc(gName(g.id))}</option>`).join("")}</select></label>
    <label class="field"><span>${t("groupCode")}</span><input class="input" name="code" value="${esc(G.code)}" dir="ltr" style="text-transform:uppercase;letter-spacing:2px;font-weight:800;color:var(--gold)"></label>
    <div class="field"><button class="btn sm blue">${t("saveCode")}</button></div></form></div>

  <div class="grid g2" style="align-items:start">
   <div class="card"><h3>${t("tRec")} (${C.recordings.length})</h3>
     <form id="recF"><div class="form-grid"><label class="field"><span>${t("recTitle")}</span><input class="input" name="title" required placeholder="${t("recPh")}"></label>
     <label class="field"><span>${t("recDate")}</span><input class="input" type="date" name="date" value="${today()}"></label></div>
     <label class="field"><span>${t("driveLink")}</span><input class="input" name="url" required dir="ltr" placeholder="https://drive.google.com/file/d/.../view"></label>
     <label class="field"><span>${t("notes")}</span><input class="input" name="notes"></label>
     <div class="notice" style="font-size:.88rem;margin:8px 0">${t("driveHelp")}</div>
     <button class="btn sm">${t("addRec")}</button></form><hr style="border-color:var(--line)">
     ${C.recordings.map((r,k)=>item("recordings",k,r.title, esc(r.date||"")+" · "+(embedUrl(r.url)?t("playable"):t("notEmb")))).join("")||`<p class="muted">${t("noRecA")}</p>`}</div>

   <div class="card"><h3>${t("tHw")} (${C.homework.length})</h3>
     <form id="hwF"><label class="field"><span>${t("fTitle").replace(" (AR)","")}</span><input class="input" name="title" required></label>
     <label class="field"><span>${t("hwInstr")}</span><textarea class="input" name="desc" rows="3"></textarea></label>
     <div class="form-grid"><label class="field"><span>${t("due").replace(": ","").replace(" : ","")}</span><input class="input" type="date" name="due"></label>
     <label class="field"><span>${t("hwLink")}</span><input class="input" name="url" dir="ltr" placeholder="https://..."></label></div>
     <button class="btn sm">${t("addHw")}</button></form><hr style="border-color:var(--line)">
     ${C.homework.map((h,k)=>item("homework",k,h.title, h.due?t("due")+esc(h.due):t("noDue"))).join("")||`<p class="muted">${t("noHwA")}</p>`}</div>

   <div class="card"><h3>${t("weekly")}</h3>
     <form id="chF"><label class="field"><span>${t("fTitle").replace(" (AR)","").replace(" *","")}</span><input class="input" name="title" value="${esc(C.challenge.title||"")}"></label>
     <label class="field"><span>${t("chDesc")}</span><textarea class="input" name="desc" rows="3">${esc(C.challenge.desc||"")}</textarea></label>
     <label class="field"><span>${t("chLink")}</span><input class="input" name="url" dir="ltr" value="${esc(C.challenge.url||"")}"></label>
     <button class="btn sm">${t("saveCh")}</button> <button type="button" class="btn sm red" id="chClr">${t("remove")}</button></form></div>

   <div class="card"><h3>${t("extraGames")} (${C.games.length})</h3>
     <p class="muted" style="font-size:.9rem">${t("extraHelp")}</p>
     <form id="gmF"><div class="form-grid"><label class="field"><span>${t("fTitle").replace(" (AR)","")}</span><input class="input" name="title" required></label>
     <label class="field"><span>${t("link")}</span><input class="input" name="url" required dir="ltr" placeholder="https://..."></label></div>
     <label class="field"><span>${t("desc")}</span><input class="input" name="desc"></label><button class="btn sm">${t("add")}</button></form><hr style="border-color:var(--line)">
     ${C.games.map((x,k)=>item("games",k,x.title, esc(x.url))).join("")||`<p class="muted">${t("noLinks")}</p>`}</div>
  </div>`;
  $("#gSel").onchange = e => { aGroup = +e.target.value; admGrp(b); };
  $("#gInfo").onsubmit = e => { e.preventDefault(); const code = normCode(fd(e.target).code); if(code.length<4) return toast(t("codeShort"));
    G.code = code; markDirty(); toast(t("saved")); admGrp(b); };
  const add = (id, fn) => $(id).onsubmit = e => { e.preventDefault(); const o = fd(e.target); if(o.url && !safeUrl(o.url)) return toast(t("needHttps")); fn(o); markDirty(); toast(t("added")); admGrp(b); };
  add("#recF", o => C.recordings.push({title:o.title, date:o.date||today(), url:o.url, notes:o.notes}));
  add("#hwF", o => C.homework.push({title:o.title, desc:o.desc, due:o.due, url:o.url}));
  add("#gmF", o => C.games.push({title:o.title, url:o.url, desc:o.desc}));
  add("#chF", o => C.challenge = {title:o.title, desc:o.desc, url:o.url});
  $("#chClr").onclick = () => { C.challenge = {}; markDirty(); admGrp(b); };
  b.querySelectorAll("[data-rm]").forEach(x => x.onclick = () => armed(x, () => { const [key,k] = x.dataset.rm.split(":"); C[key].splice(+k,1); markDirty(); admGrp(b); }));
}

function admSet(b){
  b.innerHTML = `<div class="grid g2" style="align-items:start">
   <form class="card" id="setF"><h3>${t("contact")}</h3>
     <label class="field"><span>${t("waNum")}</span><input class="input" name="whatsapp" dir="ltr" value="${esc(A.settings.whatsapp||"")}" placeholder="212706600479"></label>
     <button class="btn sm">${t("save")}</button></form>
   <form class="card" id="pwF"><h3>${t("chPass")}</h3>
     <label class="field"><span>${t("newPass")}</span><input class="input" name="p1" type="password" required></label>
     <label class="field"><span>${t("confPass")}</span><input class="input" name="p2" type="password" required></label>
     <button class="btn sm">${t("change")}</button></form>
   <div class="card"><h3>${t("allCodes")}</h3><p class="muted" style="font-size:.9rem">${t("allCodesD")}</p>
     ${A.groups.map(g=>`<div class="list-item"><div class="t">${esc(gName(g.id))}</div><b dir="ltr" style="color:var(--gold);letter-spacing:2px">${esc(g.code)}</b></div>`).join("")}</div></div>`;
  $("#setF").onsubmit = e => { e.preventDefault(); A.settings.whatsapp = fd(e.target).whatsapp.replace(/\D/g,""); markDirty(); toast(t("saved")); };
  $("#pwF").onsubmit = e => { e.preventDefault(); const o = fd(e.target); if(o.p1.length<6) return toast(t("passShort")); if(o.p1!==o.p2) return toast(t("passDiff")); A.pass = o.p1; markDirty(); toast(t("passLater")); e.target.reset(); };
}

async function buildData(){
  const groups = [], codes = {};
  for(const g of A.groups){ codes[g.id] = g.code; groups.push({id:g.id, blob: await encryptJSON(g.content, g.code)}); }
  return {version:3, updated:new Date().toISOString(), settings:A.settings, announcements:A.announcements, groups, admin: await encryptJSON({codes}, A.pass)};
}
const dataToJs = d => `/* Soroban for All — data file, generated from the teacher space. Each group's content is encrypted with its secret code. */\nwindow.SFA_DATA = ${JSON.stringify(d,null,1)};\n`;
function admPub(b){
  b.innerHTML = `<div class="card"><h3>${t("pubTitle")}</h3>
    <ol style="line-height:2.1"><li>${t("pub1")}</li><li>${t("pub2")}</li><li>${t("pub3")}</li></ol>
    <div class="row" style="justify-content:flex-start;margin-top:10px">
      <button class="btn blue" id="pPrev">${t("preview")}</button><button class="btn" id="pDl">${t("download")}</button><button class="btn ghost" id="pCopy">${t("copy")}</button></div>
    <div class="notice" style="margin-top:14px">${t("pubNote")}</div>
    <textarea class="input" id="pOut" rows="6" style="margin-top:14px;direction:ltr;font-family:monospace;font-size:.8rem;display:none" readonly></textarea></div>`;
  const gen = async () => dataToJs(await buildData());
  $("#pPrev").onclick = async () => { D = await buildData(); for(const k in unlocked) delete unlocked[k]; toast(t("applied")); };
  $("#pDl").onclick = async () => { const txt = await gen(); const ta = $("#pOut"); ta.value = txt; ta.style.display = "block";
    try{ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt],{type:"text/javascript"})); a.download = "data.js"; document.body.appendChild(a); a.click(); a.remove(); dirty = false; $("#dirtyBar")?.classList.remove("show"); toast(t("downloaded")); }
    catch(e){ toast(t("copyBelow")); } };
  $("#pCopy").onclick = async () => { const txt = await gen(); const ta = $("#pOut"); ta.value = txt; ta.style.display = "block"; ta.select();
    try{ await navigator.clipboard.writeText(txt); toast(t("copied")); }catch(e){ try{ document.execCommand("copy"); toast(t("copied")); }catch(_){ toast(t("copyManual")); } } };
}
